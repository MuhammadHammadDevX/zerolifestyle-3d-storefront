<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="wireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#7b2cbf"/>
    </linearGradient>

    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes spinCube {
      0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
      100% { transform: rotateX(360deg) rotateY(360deg) rotateZ(360deg); }
    }
    @keyframes pulseRing {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.08); opacity: 0.95; }
    }
    @keyframes scanline {
      0% { transform: translateY(-50px); opacity: 0; }
      50% { opacity: 0.4; }
      100% { transform: translateY(220px); opacity: 0; }
    }
    .cube-wire {
      transform-origin: 820px 160px;
      animation: spinCube 20s linear infinite;
    }
    .pulse-target {
      transform-origin: 820px 160px;
      animation: pulseRing 3s ease-in-out infinite;
    }
    .scan {
      animation: scanline 3.5s linear infinite;
    }
  </style>

  <!-- Container Box -->
  <rect width="1000" height="320" rx="16" fill="url(#cardBg)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2"/>

  <!-- Left Information Column -->
  <g transform="translate(60, 50)">
    <!-- Header -->
    <rect x="0" y="0" width="160" height="28" rx="14" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8"/>
    <text x="80" y="19" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">WEBXR 3D ENGINE</text>

    <text x="0" y="70" font-family="'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#f8fafc" letter-spacing="1">INTERACTIVE 3D PRODUCT VIEWER</text>
    <text x="0" y="105" font-family="'Segoe UI', sans-serif" font-size="16" fill="#94a3b8">
      Photorealistic GLTF/GLB models rendered with Google &lt;model-viewer&gt;
    </text>

    <!-- 3 Mini Feature Badges -->
    <g transform="translate(0, 140)">
      <rect x="0" y="0" width="160" height="55" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)"/>
      <text x="18" y="24" font-family="'Segoe UI', sans-serif" font-size="12" fill="#38bdf8" font-weight="700">360° ORBIT</text>
      <text x="18" y="42" font-family="'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">Touch &amp; Drag</text>

      <rect x="180" y="0" width="160" height="55" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)"/>
      <text x="198" y="24" font-family="'Segoe UI', sans-serif" font-size="12" fill="#a855f7" font-weight="700">AR QUICK-LOOK</text>
      <text x="198" y="42" font-family="'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">SceneViewer / WebXR</text>

      <rect x="360" y="0" width="180" height="55" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)"/>
      <text x="378" y="24" font-family="'Segoe UI', sans-serif" font-size="12" fill="#00f5d4" font-weight="700">RANGE STREAMING</text>
      <text x="378" y="42" font-family="'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">Instant 13MB Load</text>
    </g>

    <text x="0" y="240" font-family="'Segoe UI', sans-serif" font-size="13" fill="#64748b">
      Asset: /3d/models/7996311cf3ce7e1e/Display_GLB.glb (13.58 MB)
    </text>
  </g>

  <!-- Right Side Interactive 3D Wireframe HUD & Visual -->
  <g class="pulse-target">
    <circle cx="820" cy="160" r="100" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-dasharray="10 8" opacity="0.4"/>
    <circle cx="820" cy="160" r="120" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 12" opacity="0.3"/>
  </g>

  <!-- 3D Polyhedron / Isometric Wireframe -->
  <g class="cube-wire" filter="url(#neonBlur)">
    <!-- Isometric Cube Front/Back -->
    <polygon points="820,90 890,130 890,210 820,250 750,210 750,130" fill="rgba(56, 189, 248, 0.08)" stroke="#38bdf8" stroke-width="2"/>
    <line x1="820" y1="90" x2="820" y2="170" stroke="#00f5d4" stroke-width="2"/>
    <line x1="820" y1="170" x2="890" y2="210" stroke="#00f5d4" stroke-width="2"/>
    <line x1="820" y1="170" x2="750" y2="210" stroke="#00f5d4" stroke-width="2"/>
    <circle cx="820" cy="170" r="5" fill="#f43f5e"/>
    <circle cx="820" cy="90" r="4" fill="#38bdf8"/>
    <circle cx="890" cy="130" r="4" fill="#a855f7"/>
    <circle cx="890" cy="210" r="4" fill="#38bdf8"/>
    <circle cx="820" cy="250" r="4" fill="#a855f7"/>
    <circle cx="750" cy="210" r="4" fill="#38bdf8"/>
    <circle cx="750" cy="130" r="4" fill="#a855f7"/>
  </g>

  <!-- HUD Crosshairs & Coordinates -->
  <g opacity="0.7">
    <line x1="800" y1="160" x2="840" y2="160" stroke="#f43f5e" stroke-width="1.5"/>
    <line x1="820" y1="140" x2="820" y2="180" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="820" y="295" font-family="monospace" font-size="11" fill="#38bdf8" text-anchor="middle">
      CAMERA-ORBIT: 35.0deg 61.1deg 5.99m
    </text>
  </g>
</svg>
