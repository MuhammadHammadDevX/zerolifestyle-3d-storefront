<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="spaceGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0a1128"/>
      <stop offset="45%" stop-color="#050814"/>
      <stop offset="100%" stop-color="#020308"/>
    </radialGradient>

    <!-- Neon Accents -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="50%" stop-color="#00bbf9"/>
      <stop offset="100%" stop-color="#7b2cbf"/>
    </linearGradient>

    <linearGradient id="neonGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="50%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#9d4edd"/>
    </linearGradient>

    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0, 245, 212, 0)"/>
      <stop offset="50%" stop-color="rgba(0, 245, 212, 0.8)"/>
      <stop offset="100%" stop-color="rgba(157, 78, 221, 0)"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.02); }
    }
    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes counterRotate {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-12px) translateX(6px); opacity: 0.9; }
    }
    @keyframes neonShift {
      0%, 100% { filter: drop-shadow(0 0 15px rgba(0,255,136,0.6)); }
      50% { filter: drop-shadow(0 0 25px rgba(0,210,255,0.9)); }
    }
    @keyframes gridSweep {
      0% { transform: translateY(0); }
      100% { transform: translateY(30px); }
    }

    .bg { fill: url(#spaceGrad); }
    .neon-text {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      font-weight: 900;
      letter-spacing: 6px;
      fill: #ffffff;
      animation: neonShift 6s ease-in-out infinite;
    }
    .sub-text {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      font-weight: 600;
      letter-spacing: 4px;
      fill: #00f5d4;
    }
    .badge-text {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      font-weight: 500;
      letter-spacing: 2px;
      font-size: 13px;
      fill: #e0e7ff;
    }
    .ring1 {
      transform-origin: 980px 210px;
      animation: rotateRing 18s linear infinite;
    }
    .ring2 {
      transform-origin: 980px 210px;
      animation: counterRotate 24s linear infinite;
    }
    .ring3 {
      transform-origin: 980px 210px;
      animation: rotateRing 12s linear infinite;
    }
    .floating-dot {
      animation: floatParticle 4s ease-in-out infinite;
    }
  </style>

  <!-- Deep Cosmic Canvas -->
  <rect width="100%" height="100%" class="bg" rx="16" />

  <!-- Perspective 3D Grid Floor -->
  <g opacity="0.12">
    <line x1="0" y1="360" x2="1200" y2="360" stroke="#00f5d4" stroke-width="1.5"/>
    <line x1="0" y1="380" x2="1200" y2="380" stroke="#00f5d4" stroke-width="1.5"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#00f5d4" stroke-width="2"/>
    <line x1="100" y1="340" x2="0" y2="420" stroke="#00f5d4" stroke-width="1.5"/>
    <line x1="300" y1="340" x2="200" y2="420" stroke="#00f5d4" stroke-width="1.5"/>
    <line x1="500" y1="340" x2="450" y2="420" stroke="#00f5d4" stroke-width="1.5"/>
    <line x1="700" y1="340" x2="700" y2="420" stroke="#00f5d4" stroke-width="1.5"/>
    <line x1="900" y1="340" x2="950" y2="420" stroke="#00f5d4" stroke-width="1.5"/>
    <line x1="1100" y1="340" x2="1200" y2="420" stroke="#00f5d4" stroke-width="1.5"/>
  </g>

  <!-- Cyber Particles -->
  <circle cx="120" cy="80" r="2.5" fill="#00f5d4" class="floating-dot" style="animation-delay: 0s;"/>
  <circle cx="280" cy="140" r="1.5" fill="#00bbf9" class="floating-dot" style="animation-delay: 1s;"/>
  <circle cx="450" cy="70" r="2" fill="#7b2cbf" class="floating-dot" style="animation-delay: 2s;"/>
  <circle cx="620" cy="110" r="1.5" fill="#00ff88" class="floating-dot" style="animation-delay: 0.5s;"/>
  <circle cx="80" cy="280" r="2" fill="#00f5d4" class="floating-dot" style="animation-delay: 1.5s;"/>
  <circle cx="340" cy="300" r="2.5" fill="#9d4edd" class="floating-dot" style="animation-delay: 2.5s;"/>

  <!-- Left Content Side -->
  <g transform="translate(70, 70)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="280" height="34" rx="17" fill="rgba(0, 245, 212, 0.12)" stroke="rgba(0, 245, 212, 0.4)" stroke-width="1.5"/>
    <circle cx="18" cy="17" r="5" fill="#00ff88" filter="url(#glow)"/>
    <text x="32" y="22" class="badge-text" fill="#00ff88">NEXT-GEN WEARABLE TECH</text>

    <!-- Main 3D Brand Title -->
    <text x="0" y="105" font-size="56" class="neon-text" filter="url(#intenseGlow)">ZERO LIFESTYLE</text>

    <!-- Tagline & Highlights -->
    <text x="0" y="148" font-size="20" class="sub-text">IMMERSIVE 3D WEBXR E-COMMERCE STOREFRONT</text>

    <!-- Specs List / Highlights -->
    <g transform="translate(0, 185)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="170" height="42" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(0, 245, 212, 0.25)"/>
      <text x="15" y="26" class="badge-text" fill="#fff">✨ 3D GLB Models</text>

      <!-- Item 2 -->
      <rect x="185" y="0" width="165" height="42" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(0, 187, 249, 0.25)"/>
      <text x="200" y="26" class="badge-text" fill="#fff">⚡ 298+ Products</text>

      <!-- Item 3 -->
      <rect x="365" y="0" width="165" height="42" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(157, 78, 221, 0.25)"/>
      <text x="380" y="26" class="badge-text" fill="#fff">🌐 100% Offline</text>

      <!-- Item 4 -->
      <rect x="545" y="0" width="175" height="42" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(0, 255, 136, 0.25)"/>
      <text x="560" y="26" class="badge-text" fill="#fff">🚀 Zero-Dep Server</text>
    </g>
  </g>

  <!-- Glowing Line Divider -->
  <line x1="70" y1="330" x2="1130" y2="330" stroke="url(#glowLine)" stroke-width="2"/>

  <!-- Right Side: 3D Holographic Gyroscope Orb (Pure Animated SVG) -->
  <g class="ring1">
    <ellipse cx="980" cy="200" rx="125" ry="125" fill="none" stroke="url(#neonCyan)" stroke-width="2.5" stroke-dasharray="16 10" filter="url(#glow)"/>
    <circle cx="1105" cy="200" r="5" fill="#00f5d4" filter="url(#intenseGlow)"/>
  </g>
  <g class="ring2">
    <ellipse cx="980" cy="200" rx="95" ry="50" fill="none" stroke="url(#neonGold)" stroke-width="2" stroke-dasharray="8 6" filter="url(#glow)"/>
    <circle cx="980" cy="250" r="4.5" fill="#00d2ff"/>
  </g>
  <g class="ring3">
    <ellipse cx="980" cy="200" rx="65" ry="65" fill="none" stroke="#7b2cbf" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="980" cy="135" r="3.5" fill="#9d4edd"/>
  </g>
  <!-- Center Glowing Holographic Core -->
  <circle cx="980" cy="200" r="28" fill="url(#neonGold)" opacity="0.85" filter="url(#intenseGlow)"/>
  <text x="980" y="206" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="16" fill="#050814" text-anchor="middle">3D</text>

  <!-- Subtitle Bottom bar -->
  <text x="70" y="375" font-family="'Segoe UI', sans-serif" font-size="13" fill="#8892b0" letter-spacing="1.5">
    ENGINEERED WITH HIGH-FIDELITY WEBXR • GOOGLE MODEL-VIEWER • SHOPIFY OS 2.0 • NODE.JS STREAMING
  </text>
  <text x="1130" y="375" font-family="'Segoe UI', sans-serif" font-size="13" fill="#00f5d4" letter-spacing="2" text-anchor="end">
    v2.0 PRODUCTION READY
  </text>
</svg>
